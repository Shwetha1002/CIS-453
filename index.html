<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Prototype</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
   
    <div id="login-box">
        <h2>Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit">Sign In</button>
        </form>
        <p class="toggle-text">Don't have an account? <a id="to-signup">Sign Up</a></p>
    </div>

    <!-- SIGN UP FORM -->
    <div id="signup-box" class="hidden">
        <h2>Create Account</h2>
        <form id="signup-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" required placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-password" required placeholder="Create password">
            </div>
            <button type="submit">Register</button>
        </form>
        <p class="toggle-text">Already have an account? <a id="to-login">Login</a></p>
    </div>

    
    <div id="msg" class="message hidden"></div>
</div>


<script src="script.js"></script>
</body>
</html>
